<title>Weso HR</title>
<style>
/* ==========================================================================
   Weso HR — Product Tour
   Design tokens ground the whole page in the SHIPPING product's own palette
   (frontend/tailwind.config.js): teal #00A896, navy #0F2B48, amber #F59E0B,
   green #10B981, slate neutrals, Inter (LTR) / Tajawal (RTL).
   ========================================================================== */

:root{
  /* theme-invariant brand marks — used only for fixed-appearance decorative
     surfaces (the license "Core" hero card, the brand mark) that must stay
     navy/teal on purpose regardless of light/dark mode; never used for text,
     which instead uses the theme-swapped --navy/--primary tokens below. */
  --brand-navy:#0f2b48;
  --brand-teal:#00a896;
  --bg:#f1f5f9;
  --bg-soft:#e7eef4;
  --surface:#ffffff;
  --surface-2:#f8fafc;
  --border:#e2e8f0;
  --border-soft:#edf2f7;
  --text:#0f172a;
  --text-muted:#54637a;
  --text-faint:#8697ac;
  --primary:#00a896;
  --primary-600:#00a896;
  --primary-700:#008a7b;
  --primary-100:#d9f2ef;
  --primary-50:#f0faf9;
  --on-primary:#ffffff;
  --navy:#0f2b48;
  --navy-tint:#eaf0f6;
  --amber:#b7660a;
  --amber-tint:#fdf1e0;
  --green:#0e7a54;
  --green-tint:#e4f7ee;
  --shadow-sm:0 1px 2px rgba(15,23,42,.06);
  --shadow-md:0 8px 24px -8px rgba(15,23,42,.16);
  --shadow-lg:0 24px 48px -16px rgba(15,23,42,.22);
  --radius-lg:1.25rem;
  --radius-md:0.9rem;
  --radius-sm:0.6rem;
  --font-display:'TajawalX','InterVar',system-ui,sans-serif;
  --font-body:'InterVar','TajawalX',system-ui,sans-serif;
  color-scheme:light;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1420;
    --bg-soft:#0e1a2a;
    --surface:#131f30;
    --surface-2:#182740;
    --border:#26374f;
    --border-soft:#1e2e45;
    --text:#eef2f8;
    --text-muted:#9db0c9;
    --text-faint:#6b8098;
    --primary:#2fc3b2;
    --primary-600:#2fc3b2;
    --primary-700:#5cd4c5;
    --primary-100:rgba(47,195,178,.16);
    --primary-50:rgba(47,195,178,.08);
    --on-primary:#04211d;
    --navy:#9fc0e6;
    --navy-tint:rgba(159,192,230,.12);
    --amber:#f7b955;
    --amber-tint:rgba(247,185,85,.13);
    --green:#5fd9a4;
    --green-tint:rgba(95,217,164,.13);
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow-md:0 8px 28px -10px rgba(0,0,0,.55);
    --shadow-lg:0 30px 60px -20px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1420; --bg-soft:#0e1a2a; --surface:#131f30; --surface-2:#182740;
  --border:#26374f; --border-soft:#1e2e45; --text:#eef2f8; --text-muted:#9db0c9; --text-faint:#6b8098;
  --primary:#2fc3b2; --primary-600:#2fc3b2; --primary-700:#5cd4c5;

  --navy:#9fc0e6; --navy-tint:rgba(159,192,230,.12);
  --amber:#f7b955; --amber-tint:rgba(247,185,85,.13);
  --green:#5fd9a4; --green-tint:rgba(95,217,164,.13);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 8px 28px -10px rgba(0,0,0,.55); --shadow-lg:0 30px 60px -20px rgba(0,0,0,.6);

}

:root[data-force-theme="light"]{
  --bg:#f1f5f9; --bg-soft:#e7eef4; --surface:#ffffff; --surface-2:#f8fafc;
  --border:#e2e8f0; --border-soft:#edf2f7; --text:#0f172a; --text-muted:#54637a; --text-faint:#8697ac;

  --primary:#2fc3b2; --primary-600:#2fc3b2; --primary-700:#5cd4c5;
  --primary-100:rgba(47,195,178,.16); --primary-50:rgba(47,195,178,.08); --on-primary:#04211d;

  color-scheme:dark;

/* ---- reset & base ---- */
*,*::before,*::after{box-sizing:border-box;}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.6;
  transition:background-color .35s ease,color .35s ease;
  overflow-x:hidden;
}
html[dir="rtl"] body{ --font-body:'TajawalX','InterVar',system-ui,sans-serif; }
html[dir="ltr"] body{ --font-body:'InterVar','TajawalX',system-ui,sans-serif; }
h1,h2,h3,h4{ font-family:var(--font-display); margin:0; text-wrap:balance; letter-spacing:-.01em; }
p{ margin:0; }
img,svg{ display:block; max-width:100%; }
a{ color:inherit; }
button{ font-family:inherit; cursor:pointer; }
:focus-visible{ outline:2.5px solid var(--primary); outline-offset:2px; border-radius:.4rem; }
::selection{ background:var(--primary-100); color:var(--text); }
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; scroll-behavior:auto !important; }
}
::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:var(--border); border-radius:6px; }

.container{ max-width:1180px; margin-inline:auto; padding-inline:clamp(1rem,4vw,2.25rem); }
.tabular{ font-variant-numeric:tabular-nums; }
.sr-only{ position:absolute; width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0; }
[dir="rtl"] .icon-flip{ transform:scaleX(-1); }

/* ---- top progress bar ---- */
#progress-bar{ position:fixed; inset-inline:0; top:0; height:3px; background:linear-gradient(90deg,var(--primary),var(--amber)); width:0%; z-index:100; transition:width .12s linear; }

/* ---- header ---- */
.site-header{
  position:sticky; top:0; z-index:60;
  background:color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border-soft);
}
.header-inner{ display:flex; align-items:center; gap:1rem; padding-block:.75rem; }

  if (savedTheme === 'light' || savedTheme === 'dark' || savedTheme === 'auto') state.theme = savedTheme;

   into a representative icon — this is what keeps 80+ mini-flows from all
   looking identical: a submit step looks different from an approval step,
   which looks different from a payment or a lock/security step. */
function guessStepIcon(enText, isLast){
  var s = (enText || '').toLowerCase();
  if (/reject|cancel|denied/.test(s)) return 'x';
  if (/approv|confirm|sign[- ]?off|accept|verified|verify/.test(s)) return 'check-circle';
  if (/vote|committee|branch|outcome/.test(s)) return 'gavel';
  if (/notif|alert|email|bell|invite/.test(s)) return 'bell';
  if (/review|compare|match|inspect|audit/.test(s)) return 'eye';
  if (/lock|secur|restrict|permission|access/.test(s)) return 'lock';
  if (/pay|disburs|deduct|payout|payroll|salary|gross|net|budget|cost|advance|loan/.test(s)) return 'wallet';
  if (/calculat|comput|aggregat|total|sum|preview/.test(s)) return 'hash';
  if (/submit|request|log |create|register|add |enter|draft|upload|select|pick|choos|tap|click|open/.test(s)) return 'send';

}

   in every page card. It starts STATIC (step 1, not playing) — with 80+ of
   these on one page, auto-playing all of them by default turned the whole
   deck into a constantly-flickering wall of motion, which read as chaotic
   rather than professional. Nothing moves until a visitor actually clicks a
   step (jumps straight there) or presses play (animates just that one card).
   State lives in FLOW_STATE, keyed by a stable id (module+page index) so it
   survives re-render on language toggle only by being freshly re-initialized

var FLOW_STATE = {};

  var n = steps.length;

  var st = FLOW_STATE[id];
  var stepsHtml = steps.map(function(s, i){
    var iconKey = guessStepIcon(s.en, i === n - 1);
    var isActive = i === st.current;
    var isDone = i < st.current;
    return '<button type="button" class="mf-step' + (isActive ? ' active' : '') + (isDone ? ' done' : '') + '" data-mf="' + id + '" data-idx="' + i + '" aria-label="' + esc(t(s)) + '">' +
      '<span class="mf-dot">' + icon(iconKey) + '</span>' +
      '<span class="mf-lbl">' + esc(t(s)) + '</span>' +
    '</button>';
  }).join('');
  var pct = n > 1 ? (st.current / (n - 1)) * 100 : 0;
  return '' +
    '<div class="mf" data-mf-root="' + id + '">' +
      '<div class="mf-track"><div class="mf-fill" data-mf-fill="' + id + '" style="width:' + pct + '%"></div></div>' +
      '<div class="mf-steps">' + stepsHtml + '</div>' +

}
function updateFlowDOM(id){
  var st = FLOW_STATE[id];
  if (!st) return;
  var root = document.querySelector('[data-mf-root="' + id + '"]');
  if (!root) return;
  root.querySelectorAll('.mf-step').forEach(function(btn){
    var i = +btn.getAttribute('data-idx');
    btn.classList.toggle('active', i === st.current);
    btn.classList.toggle('done', i < st.current);

  if (fill) fill.style.width = (st.n > 1 ? (st.current / (st.n - 1)) * 100 : 0) + '%';

setInterval(function(){
  Object.keys(FLOW_STATE).forEach(function(id){

/* ---------------------------------------------------------------------- */
/* Theme / lang controls                                                  */
/* ---------------------------------------------------------------------- */
function applyTheme(){
  var root = document.documentElement;
  root.removeAttribute('data-force-theme');
  if (state.theme === 'light' || state.theme === 'dark') root.setAttribute('data-force-theme', state.theme);
  var btn = document.getElementById('theme-toggle');
  if (!btn) return;
  var isDark = state.theme === 'dark' || (state.theme === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  btn.innerHTML = icon(isDark ? 'sun' : 'moon');
  btn.title = state.lang === 'ar' ? 'تبديل الوضع الليلي' : 'Toggle dark mode';
}

function setLang(l){ state.lang = l; try{ localStorage.setItem('weso-tour-lang', l); }catch(e){} renderAll(); }
function setTheme(m){ state.theme = m; try{ localStorage.setItem('weso-tour-theme', m); }catch(e){} applyTheme(); }

/* ---------------------------------------------------------------------- */
/* Scroll effects: reveal, progress bar, scrollspy, counters              */
/* ---------------------------------------------------------------------- */
var io = null;
var diagramIO = null;
function initObservers(){
  if (io) io.disconnect();
  io = new IntersectionObserver(function(entries){
    entries.forEach(function(en){ if (en.isIntersecting){ en.target.classList.add('in-view'); io.unobserve(en.target); } });
  }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });
  document.querySelectorAll('.reveal').forEach(function(el){ io.observe(el); });

  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (diagramIO) diagramIO.disconnect();
  if (!reduced){
    diagramIO = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if (!en.isIntersecting) return;
        diagramIO.unobserve(en.target);
        var anims = DIAGRAM_ANIMS[en.target.id] || [];
        anims.forEach(function(a){
          setTimeout(function(){
            var el = document.getElementById(a.id);
            if (el && el.beginElement) { try { el.beginElement(); } catch(e){} }
          }, a.delaySec * 1000);
        });
      });
    }, { threshold: 0.35 });
    ['architecture', 'approvals-diagram', 'payroll-diagram'].forEach(function(sid){
      var el = document.getElementById(sid);
      if (el) diagramIO.observe(el);
    });
  }
}

function animateCounters(){
  document.querySelectorAll('[data-count]').forEach(function(el){
    var raw = el.textContent;
    var m = raw.match(/^(\d+)(.*)$/);
    if (!m){ return; }
    var target = parseInt(m[1], 10), suffix = m[2];
    var dur = 900, start = null;
    function step(ts){
      if (!start) start = ts;
      var p = Math.min(1, (ts - start) / dur);
      var eased = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(target * eased) + suffix;
      if (p < 1) requestAnimationFrame(step);
    }
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){ el.textContent = target + suffix; return; }
    requestAnimationFrame(step);
  });
}

function updateActiveNav(){
  var links = Array.prototype.slice.call(document.querySelectorAll('#quick-nav a'));
  var sections = links.map(function(l){ return document.getElementById(l.getAttribute('data-nav')); }).filter(Boolean);
  function onScroll(){
    var bar = document.getElementById('progress-bar');
    if (bar){
      var h = document.documentElement;
      var pct = (h.scrollTop) / (h.scrollHeight - h.clientHeight) * 100;
      bar.style.width = Math.min(100, Math.max(0, pct)) + '%';
    }
    var y = window.scrollY + 110;
    var current = sections[0];
    sections.forEach(function(s){ if (s.offsetTop <= y) current = s; });
    links.forEach(function(l){ l.classList.toggle('active', current && l.getAttribute('data-nav') === current.id); });
    var toTop = document.getElementById('to-top');
    if (toTop) toTop.classList.toggle('show', window.scrollY > 700);
  }
  window.removeEventListener('scroll', window.__wesoScroll || function(){});
  window.__wesoScroll = onScroll;
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
}

/* ---------------------------------------------------------------------- */
/* Global event delegation                                                */
/* ---------------------------------------------------------------------- */
document.addEventListener('click', function(e){
  var a = e.target.closest('a[data-nav]');
  if (a){
    var target = document.getElementById(a.getAttribute('data-nav'));
    if (target){ e.preventDefault(); target.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    return;
  }
  if (e.target.closest('#lang-toggle')){ setLang(state.lang === 'ar' ? 'en' : 'ar'); return; }
  if (e.target.closest('#theme-toggle')){
    var isDark = state.theme === 'dark' || (state.theme === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    setTheme(isDark ? 'light' : 'dark');
    return;
  }
  if (e.target.closest('#to-top')){ window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  var stepBtn = e.target.closest('.mf-step');
  if (stepBtn){
    var fid = stepBtn.getAttribute('data-mf');
    var st = FLOW_STATE[fid];
    if (st){ st.current = +stepBtn.getAttribute('data-idx'); st.playing = false; updateFlowDOM(fid); }
    return;
  }
  var playBtn = e.target.closest('[data-mf-play]');
  if (playBtn){
    var fid2 = playBtn.getAttribute('data-mf-play');
    var st2 = FLOW_STATE[fid2];
    if (st2){ st2.playing = !st2.playing; updateFlowDOM(fid2); }
    return;
  }
});

if (window.matchMedia){
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ if (state.theme === 'auto') applyTheme(); });
}

renderAll();
})();
